name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        env:
          MPLBACKEND: Agg
        run: pytest
      - name: CLI smoke test
        env:
          MPLBACKEND: Agg
        run: |
          tblab bands graphene --path G-K-M-G --out ci_output
          test -s ci_output/graphene_bands.png
          test -s ci_output/graphene_bands.json
          tblab verify
