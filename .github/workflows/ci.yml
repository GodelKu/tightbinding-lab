name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
        shell: bash
      - run: mypy
      - run: pytest -q
      - name: CLI smoke test
        shell: bash
        run: |
          tblab bands graphene --path G-K-M-G --out ci_output
          test -s ci_output/graphene_bands.png
          test -s ci_output/graphene_bands.json
          tblab verify
