[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tblab"
version = "0.2.0"
description = "Tight-binding lab: from-scratch band structures, DOS, Berry curvature and Kronig-Penney, checked against analytic formulas."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Georgii Baiev" }]
keywords = ["tight-binding", "solid-state-physics", "band-structure", "topological", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "matplotlib>=3.6",
]

[project.urls]
Repository = "https://github.com/GodelKu/tightbinding-lab"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
tblab = "tblab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tblab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "C4", "RUF"]
ignore = [
    "RUF001",  # we use Greek letters in labels on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tools/fill_readme.py" = ["E501"]  # markdown lines

[tool.mypy]
# no python_version: mypy checks against the interpreter it runs on (CI: 3.10 to 3.13), so the
# installed numpy stubs always match the target version
files = ["src"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
